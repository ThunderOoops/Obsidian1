<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>Obsidian — Music, in focus</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Obsidian home"><span class="brand-mark">◈</span> obsidian</a>
      <p class="side-label">YOUR SPACE</p>
      <nav id="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="home"><span>⌂</span> Home</button>
        <button class="nav-item" data-page="explore"><span>◉</span> Explore</button>
        <button class="nav-item" data-page="search"><span>⌕</span> Search</button>
        <button class="nav-item" data-page="library"><span>▤</span> My Music</button>
        <button class="nav-item" data-page="liked"><span>♥</span> Liked Songs</button>
        <button class="nav-item" data-page="playlists"><span>▦</span> Playlists</button>
        <button class="nav-item" data-page="blend"><span>✳</span> Blend</button>
      </nav>
      <div class="side-divider"></div><p class="side-label">YOUR PLAYLISTS</p>
      <div id="sidebar-playlists" class="sidebar-playlists"></div>
      <div class="sidebar-bottom"><button class="nav-item" data-page="plans"><span>✦</span> Plans <span class="premium-mini">DEMO</span></button><button class="nav-item" data-page="settings"><span>⚙</span> Settings</button><div class="local-note"><span class="online-dot"></span> Your library stays yours</div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-brand" data-page="home">◈ obsidian</button><label class="global-search"><span>⌕</span><input id="global-search" type="search" placeholder="Songs, artists, or a mood…" aria-label="Search music"><kbd>/</kbd></label><div class="top-actions"><button class="icon-button" id="theme-toggle" title="Cycle dark palette" aria-label="Cycle dark palette">☼</button><button class="mood-top" id="top-mood" title="Change mood">☀ Happy</button><span id="premium-badge" class="premium-badge hidden">✦ PREMIUM</span><button class="avatar" data-page="settings" aria-label="Settings" title="Settings">⚙</button></div></header>
      <div id="offline-banner" class="offline-banner hidden">You're offline. Your local music still works.</div>
      <div id="toast" class="toast" role="status"></div>
      <section id="content" class="content" tabindex="-1"></section>
    </main>
  </div>
  <footer class="player" id="player"><div class="now-playing"><div id="player-art" class="mini-art">◈</div><div class="track-copy"><strong id="player-title">Choose a song</strong><span id="player-artist">Your music, your way</span></div><button id="like-current" class="heart-button" aria-label="Like current song">♡</button></div><div class="transport"><div class="transport-buttons"><button id="shuffle-button" class="player-icon" title="Shuffle">⤨</button><button id="previous-button" class="player-icon" title="Previous">⏮</button><button id="play-button" class="play-button" title="Play">▶</button><button id="next-button" class="player-icon" title="Next">⏭</button><button id="repeat-button" class="player-icon" title="Repeat off">↻</button></div><div class="seek-row"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="duration">0:00</span></div></div><div class="player-tools"><canvas id="visualizer" width="92" height="28" aria-label="Audio visualizer"></canvas><button id="spatial-button" class="tool-pill" title="Spatial Sound">◉ <span>Spatial</span></button><button id="lyrics-button" class="player-icon" title="Lyrics (L)">♪</button><button id="queue-button" class="player-icon" title="Up Next">☷</button><button id="mute-button" class="player-icon" title="Mute">◖))</button><input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volume"></div></footer>
  <div id="drawer-scrim" class="drawer-scrim"></div><aside id="drawer" class="drawer" aria-label="Up Next and history"></aside>
  <div id="modal-root"></div>
  <audio id="local-audio" preload="metadata"></audio><audio id="remote-audio" preload="metadata" crossorigin="anonymous"></audio>
  <script src="js/ds.js"></script><script src="js/api.js"></script><script src="js/audio.js"></script><script src="js/lyrics.js"></script><script src="js/blend.js"></script><script src="js/app.js"></script>
</body>
</html>
